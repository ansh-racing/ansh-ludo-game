<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANSH PRAJAPATI LUDO</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#312e81);color:white;min-height:100vh}
.app{max-width:560px;margin:auto;padding:12px}
h1{text-align:center;margin:5px 0;font-size:27px}
.sub{text-align:center;color:#cbd5e1;margin-bottom:12px}
.panel{background:#ffffff12;border:1px solid #ffffff25;border-radius:18px;padding:12px;margin-bottom:12px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button,select{border:0;border-radius:12px;padding:11px 14px;font-weight:bold;font-size:14px}
button{cursor:pointer}.new{background:#22c55e;color:white}
.dice{background:#facc15;color:#111827;font-size:20px}
.info{text-align:center;margin:10px 0}
.status{text-align:center;background:#0005;border-radius:12px;padding:10px;min-height:42px}
#board{width:min(94vw,520px);aspect-ratio:1;margin:auto;background:#f8fafc;border:6px solid #111827;border-radius:16px;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr)}
.cell{border:1px solid #cbd5e1;background:#e2e8f0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px}
.path{background:white}.safe{background:#dbeafe}
.redhome{background:#fecaca}.bluehome{background:#bfdbfe}
.center{background:linear-gradient(135deg,#ef4444 50%,#3b82f6 50%)}
.token{position:absolute;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid white;box-shadow:0 3px 8px #0009;z-index:5;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;cursor:pointer}
.red{background:#ef4444}.blue{background:#3b82f6}
.can{outline:4px solid #facc15;animation:pulse .8s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15)}}
.footer{text-align:center;color:#cbd5e1;font-size:12px;margin-top:10px}
</style>
</head>

<body>
<div class="app">

<h1>🎲 ANSH PRAJAPATI LUDO</h1>
<div class="sub">👤 Ansh Prajapati vs 🤖 Computer AI</div>

<div class="panel">
<div class="controls">

<select id="level">
<option value="easy">Easy: AI</option>
<option value="medium" selected>Medium: AI</option>
<option value="hard">Hard: AI</option>
</select>

<button class="dice" id="roll" onclick="roll()">🎲 Roll</button>
<button class="new" onclick="newGame()">🔄 New Game</button>

</div>

<div class="info">
👤 Player: तुम &nbsp; | &nbsp; 🤖 Computer: AI
</div>

<div id="status" class="status">
तुम्हारी चाल है — Dice Roll करो।
</div>
</div>

<div id="board">
<div class="grid" id="grid"></div>
</div>

<div class="footer">
Made with ❤️ by Ansh Prajapati
</div>

</div>

<script>

const path=[
[6,0],[6,1],[6,2],[6,3],[6,4],
[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],
[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],
[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],
[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],
[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],
[14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],
[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],
[7,0],[6,0]
];

const safe=[0,8,13,21,26,34,39,47];

let S,turn,d,over;

function board(){

let g=document.getElementById('grid');
g.innerHTML='';

for(let r=0;r<15;r++)
for(let c=0;c<15;c++){

let x=document.createElement('div');
x.className='cell';

let home=
(r<6&&c<6)||(r<6&&c>8)||
(r>8&&c<6)||(r>8&&c>8);

if(home)
x.classList.add(
(r<6&&c<6)||(r>8&&c>8)
?'redhome':'bluehome'
);

let k=path.findIndex(p=>p[0]==r&&p[1]==c);

if(k>=0){

x.classList.add('path');

if(safe.includes(k)){
x.classList.add('safe');
x.textContent='★';
}

}

if(r>=6&&r<=8&&c>=6&&c<=8)
x.classList.add('center');

g.appendChild(x);

}

}

function newGame(){

S={
red:[-1,-1,-1,-1],
blue:[-1,-1,-1,-1]
};

turn='red';
d=0;
over=false;

msg('तुम्हारी चाल है — Dice Roll करो।');

render();

}

function msg(t){
document.getElementById('status').textContent=t;
}

function moves(c,n){

return S[c]
.map((p,i)=>
(p<0?n==6:p+n<=57)?i:-1
)
.filter(i=>i>=0);

}

function roll(){

if(over||turn!='red'||d)return;

d=1+Math.floor(Math.random()*6);

let m=moves('red',d);

msg(
`🎲 तुम्हें ${d} आया। ${
m.length
?'पीली outline वाली गोटी चुनो।'
:'कोई चाल नहीं।'
}`
);

render();

if(!m.length)
setTimeout(end,600);

}

function move(c,i,n){

let p=S[c][i];

p=p<0?0:p+n;

S[c][i]=p;

if(p<52){

let start=c=='red'?0:26;

let gp=(start+p)%52;

if(!safe.includes(gp)){

let e=c=='red'?'blue':'red';

let es=e=='red'?0:26;

S[e]=S[e].map(q=>
q>=0&&q<52&&(es+q)%52==gp
?-1:q
);

}

}

if(S[c].every(x=>x==57)){

over=true;

msg(
c=='red'
?'🏆 Ansh Prajapati जीत गए! 🎉'
:'🤖 Computer जीत गया!'
);

}

}

function player(i){

if(
turn!='red'||
!d||
!moves('red',d).includes(i)
)return;

let n=d;

move('red',i,n);

let again=n==6;

d=0;

render();

if(!over){

if(again){

msg('🎉 6 आया! फिर से Roll करो।');

}
else{

end();

}

}

}

function end(){

if(over)return;

turn=turn=='red'?'blue':'red';

render();

if(turn=='red'){

msg('तुम्हारी चाल है — Dice Roll करो।');

}
else{

msg('🤖 Computer सोच रहा है...');

setTimeout(ai,650);

}

}

function ai(){

if(over)return;

d=1+Math.floor(Math.random()*6);

let m=moves('blue',d);

if(!m.length){

d=0;
end();
return;

}

let lv=document.getElementById('level').value;

let best=m[0];
let bestScore=-999999;

for(let i of m){

let p=S.blue[i];

let np=p<0?0:p+d;

let score=0;

if(lv=='easy'){

score=Math.random()*100;

}

else{

score=np;

if(p<0)score+=25;

if(np==57)score+=120;

if(safe.includes((26+np)%52))
score+=10;

let target=(26+np)%52;

if(
S.red.some(r=>
r>=0&&r<52&&
((r+0)%52)==((target+26)%52)
)
)
score+=80;

if(lv=='hard')
score+=np*2;

score+=Math.random()*20;

}

if(score>bestScore){

bestScore=score;
best=i;

}

}

let n=d;

move('blue',best,n);

let again=n==6;

d=0;

render();

if(!over){

if(again){

setTimeout(ai,600);

}
else{

turn='red';

msg('तुम्हारी चाल है — Dice Roll करो।');

render();

}

}

}

function pos(c,p,i){

if(p<0){

return c=='red'
?[[2,2],[2,4],[4,2],[4,4]][i]
:[[2,10],[2,12],[4,10],[4,12]][i];

}

if(p==57){

return [7,7];

}

return path[((c=='red'?0:26)+p)%52];

}

function render(){

document
.querySelectorAll('.token')
.forEach(x=>x.remove());

for(let c of ['red','blue']){

S[c].forEach((p,i)=>{

let t=document.createElement('div');

t.className='token '+c;

t.textContent=i+1;

let q=pos(c,p,i);

t.style.left=((q[1]+.5)/15*100)+'%';

t.style.top=((q[0]+.5)/15*100)+'%';

t.style.transform='translate(-50%,-50%)';

if(
c=='red'&&
turn=='red'&&
d&&
moves('red',d).includes(i)
)
t.classList.add('can');

if(c=='red')
t.onclick=()=>player(i);

document
.getElementById('board')
.appendChild(t);

});

}

document.getElementById('roll').disabled=
over||turn!='red'||!!d;

}

board();
newGame();

</script>

</body>
</html>
