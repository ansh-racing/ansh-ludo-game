<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANSH PRAJAPATI LUDO</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#1e293b);color:#fff;min-height:100vh;display:flex;justify-content:center}.app{width:min(560px,100%);padding:14px}h1{text-align:center;margin:8px 0 2px;font-size:27px}.sub{text-align:center;color:#cbd5e1;margin-bottom:12px}.panel{background:#ffffff12;border:1px solid #ffffff20;border-radius:18px;padding:12px;margin-bottom:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button,select{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px}button{background:#fff;color:#111827}.new{background:#22c55e;color:#fff}.dice{font-size:22px;background:#facc15;color:#111827}.info{text-align:center;font-weight:700;line-height:1.5}.status{text-align:center;min-height:44px;padding:8px;border-radius:12px;background:#0004;margin-top:8px}#board{width:min(94vw,520px);aspect-ratio:1;margin:auto;position:relative;background:#f8fafc;border:6px solid #0f172a;border-radius:14px;overflow:hidden;box-shadow:0 12px 35px #0008}.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr)}.cell{border:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:12px;color:#475569}.path{background:#fff}.safe{background:#dbeafe!important}.redHome{background:#fecaca}.blueHome{background:#bfdbfe}.center{background:linear-gradient(135deg,#ef4444 50%,#3b82f6 50%)!important}.homeDot{border-radius:50%;background:#fff;border:2px solid #64748b;position:absolute;z-index:2}.token{position:absolute;width:8.2%;aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 8px #0008;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;z-index:5;transition:.25s;cursor:pointer}.red{background:#ef4444}.blue{background:#3b82f6}.can{outline:4px solid #facc15;animation:pulse .8s infinite}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12)}}.legend{display:flex;justify-content:space-between;font-size:13px;margin-top:10px}.footer{text-align:center;color:#94a3b8;font-size:12px;padding:8px}</style></head><body><div class="app"><h1>🎲 ANSH PRAJAPATI LUDO</h1><div class="sub">👤 तुम vs 🤖 Computer AI</div><div class="panel"><div class="controls"><label>Difficulty: <select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><button class="new" onclick="newGame()">🔄 New Game</button><button class="dice" id="roll" onclick="rollDice()">🎲 Roll</button></div><div class="info">👤 Player: तुम से खेलोगे &nbsp; | &nbsp; 🤖 Computer: AI से खेलेगा</div><div id="status" class="status"></div></div><div id="board"><div class="grid" id="grid"></div></div><div class="legend"><span>🔴 तुम्हारे 4 गोटे</span><span>🔵 Computer के 4 गोटे</span></div><div class="footer">Made with ❤️ by Ansh Prajapati</div></div><script>
const path=[[6,0],[6,1],[6,2],[6,3],[6,4],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[14,7],[14,6],[14,5],[14,4],[13,4],[12,4],[11,4],[10,4],[9,4],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0]];const safe=[0,8,13,21,26,34,39,47],start={red:0,blue:26};let state,turn,dice,gameOver;
function build(){let g=document.getElementById('grid');g.innerHTML='';for(let r=0;r<15;r++)for(let c=0;c<15;c++){let d=document.createElement('div');d.className='cell';let inHome=(r<6&&c<6)||(r<6&&c>8)||(r>8&&c<6)||(r>8&&c>8);if(inHome)d.classList.add((r<6&&c<6)||(r>8&&c>8)?'redHome':'blueHome');let idx=path.findIndex(p=>p[0]===r&&p[1]===c);if(idx>=0){d.classList.add('path');if(safe.includes(idx)){d.classList.add('safe');d.textContent='★'}}if(r>=6&&r<=8&&c>=6&&c<=8)d.classList.add('center');g.appendChild(d)}[[2,2],[2,4],[4,2],[4,4],[2,10],[2,12],[4,10],[4,12],[10,2],[10,4],[12,2],[12,4],[10,10],[10,12],[12,10],[12,12]].forEach(([r,c])=>{let e=document.createElement('div');e.className='homeDot';e.style.width='5.7%';e.style.height='5.7%';e.style.left=(c/15*100)+'%';e.style.top=(r/15*100)+'%';e.style.transform='translate(-50%,-50%)';document.getElementById('board').appendChild(e)})}
function newGame(){state={red:[-1,-1,-1,-1],blue:[-1,-1,-1,-1]};turn='red';dice=0;gameOver=false;status('तुम्हारी चाल है — Dice Roll करो।');render()};function status(t){document.getElementById('status').textContent=t}function legal(c,n){return state[c].map((p,i)=>(p===57?false:p===-1?n===6:p+n<=57)?i:-1).filter(i=>i>=0)}function rollDice(){if(gameOver||turn!=='red'||dice)return;dice=1+Math.floor(Math.random()*6);let m=legal('red',dice);status('🎲 तुम्हें '+dice+' आया। '+(m.length?'जिस गोटे को चलाना है उसे टैप करो।':'कोई चाल नहीं — Computer की बारी।'));render();if(!m.length)setTimeout(endTurn,600)}
function move(c,i,n){let p=state[c][i];state[c][i]=p===-1?0:p+n;let np=state[c][i];if(np>=0&&np<52&&!safe.includes((start[c]+np)%52)){let e=c==='red'?'blue':'red',global=(start[c]+np)%52;state[e]=state[e].map(x=>{if(x>=0&&x<52&&((start[e]+x)%52)===global)return -1;return x})}if(state[c].every(x=>x===57)){gameOver=true;status(c==='red'?'🏆 तुम जीत गए!':'🤖 Computer जीत गया!')}}
function player(i){if(turn!=='red'||!dice||!legal('red',dice).includes(i))return;let d=dice;move('red',i,d);dice=0;render();if(gameOver)return;if(d===6){status('🎉 6 आया! फिर से Dice Roll करो।');render()}else endTurn()}
function endTurn(){dice=0;if(gameOver)return;turn=turn==='red'?'blue':'red';render();if(turn==='blue'){status('🤖 Computer सोच रहा है...');setTimeout(ai,650)}else status('तुम्हारी चाल है — Dice Roll करो।')}
function ai(){if(gameOver)return;dice=1+Math.floor(Math.random()*6);let m=legal('blue',dice);if(!m.length){dice=0;turn='red';status('तुम्हारी चाल है — Dice Roll करो।');render();return}let lv=document.getElementById('difficulty').value,best=m[0],bs=-9999;for(let i of m){let p=state.blue[i],np=p===-1?0:p+dice,s=np;if(p===-1)s+=lv==='hard'?25:10;if(np===57)s+=100;if(safe.includes((start.blue+np)%52))s+=10;if(lv==='easy')s=Math.random()*100;if(lv==='hard'){let target=(start.blue+np)%52;if(state.red.some(r=>r>=0&&r<52&&(start.red+r)%52===target))s+=90}s+=Math.random()*(lv==='hard'?3:20);if(s>bs){bs=s;best=i}}let d=dice;move('blue',best,d);dice=0;render();if(gameOver)return;if(d===6){setTimeout(ai,550)}else{turn='red';status('तुम्हारी चाल है — Dice Roll करो।');render()}}
function coord(c,p,i){if(p===-1)return c==='red'?[[2,2],[2,4],[4,2],[4,4]][i]:[[2,10],[2,12],[4,10],[4,12]][i];if(p===57)return [7,7];return path[(start[c]+p)%52]}
function render(){document.querySelectorAll('.token').forEach(e=>e.remove());for(let c of ['red','blue'])state[c].forEach((p,i)=>{let t=document.createElement('div');t.className='token '+c;t.textContent=i+1;let [r,col]=coord(c,p,i);t.style.left=((col+.5)/15*100)+'%';t.style.top=((r+.5)/15*100)+'%';t.style.transform='translate(-50%,-50%)';if(c==='red'&&turn==='red'&&dice&&legal('red',dice).includes(i))t.classList.add('can');if(c==='red')t.onclick=()=>player(i);document.getElementById('board').appendChild(t)});document.getElementById('roll').disabled=gameOver||turn!=='red'||!!dice}
build();newGame();</script></body></html>
